<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Bunk2Rank</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6D1F3A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bunk2Rank"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#FFF6EC;--card:#FFFFFF;--tx:#3A1624;--mut:#8A6470;--bur:#6D1F3A;--rose:#E8869B;--peach:#FFC9A8;--lav:#C4B1E8;--line:#F1DCD3;--P:#A992DB;--C:#F4A987;--M:#E27C96;--h0:#F6E6DC;--h1:#F2B8C4;--h2:#C45577;--h3:#6D1F3A}
:root[data-theme=dark]{--bg:#3A1626;--card:#4F2236;--tx:#FFF1E4;--mut:#D9B5BE;--bur:#F2B8C4;--line:#6A3248;--h0:#5A2A40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
h1,h2,h3{margin:0}h2{font-size:1.1rem;margin:18px 0 8px}
#app{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{flex:1}.mut{color:var(--mut);font-size:.85rem}
button,.btn{font:inherit;border:0;border-radius:14px;padding:10px 16px;min-height:44px;background:var(--bur);color:#FFF6EC;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.94)}button.g{background:var(--peach);color:#4A1626}button.l{background:var(--lav);color:#3A1624}button.x{background:transparent;color:var(--mut);padding:6px 10px;min-height:36px}
:root[data-theme=dark] button:not(.g):not(.l):not(.x){background:var(--rose);color:#3A1624}
input,select,textarea{font:inherit;width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);min-height:44px}
label{display:block;margin:8px 0 2px;font-size:.85rem;color:var(--mut)}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.bar{height:8px;background:var(--h0);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;background:var(--rose);transition:width .5s}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.tag{font-size:.75rem;padding:3px 10px;border-radius:20px;background:var(--lav);color:#3A1624}
.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:conic-gradient(var(--rose) calc(var(--v)*1%),var(--h0) 0)}.ring b{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.85rem}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;color:var(--mut);font-size:.72rem;padding:6px 2px;border-radius:12px}nav button.on{background:var(--peach);color:#4A1626}nav span{display:block;font-size:1.25rem}
#fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;font-size:1.8rem;padding:0;z-index:6}
@media(min-width:900px){body{padding-left:130px;padding-bottom:20px}nav{top:0;bottom:auto;right:auto;width:120px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:20px}nav button{flex:0;margin-bottom:6px}#fab{bottom:24px}}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--rose);background:none;padding:0;min-height:28px;flex:none;color:#fff}.chk.on{background:var(--rose)}
.done{text-decoration:line-through;opacity:.55}
.meter{height:16px;border-radius:10px;background:linear-gradient(90deg,var(--peach),var(--rose),var(--bur));position:relative}.meter i{position:absolute;top:-4px;width:6px;height:24px;border-radius:4px;background:var(--tx);transition:left .5s}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.heat div{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:.7rem;color:var(--tx)}
.big{font-size:3.2rem;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.seg button{white-space:nowrap}
#mod{position:fixed;inset:0;background:rgba(58,22,36,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#mod>div{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.cf{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:30;animation:fall 1.6s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
body.focus nav,body.focus #fab{display:none}body.focus{padding-left:0}
</style></head><body>
<div id="app"></div><button id="fab" aria-label="Quick add" onclick="quick()">+</button>
<nav id="nav"></nav><div id="mod"></div>
<script>
const SUB={P:'Physics',C:'Chemistry',M:'Maths'},esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RAW=[[11,'P',"Units & Dimensions;Vector Algebra;Kinematics;Newton's Laws of Motion;Friction;Circular Motion;Work, Power and Energy;Centre of Mass;Rotation;Gravitation;Simple Harmonic Motion;Waves on String;Sound Waves;Fluids;Elasticity;Heat;Kinetic Theory of Gases;Thermodynamics"],[11,'C',"Mole Concept;Redox and Equivalent Concept;Atomic Structure;States of Matter;Periodic Table;Chemical Bonding;Thermodynamics;Thermochemistry;Chemical Equilibrium;Ionic Equilibrium;IUPAC;GOC;Isomerism;Hydrocarbons"],[11,'M',"Sets, Number and Intervals;Fundamentals of Algebra;Quadratic Equation;Logarithm;Sequence and Series;Trigonometric Ratios and Identities;Trigonometric Equations;Solution of Triangles;Permutations and Combinations;Binomial Theorem;Straight Line;Circle;Parabola;Ellipse;Hyperbola;Statistics"],[12,'P',"Electrostatics;Current Electricity;Capacitors;Magnetic Effect of Current, Magnetism;Electromagnetic Induction;Alternating Current;Geometrical Optics;Electromagnetic Waves;Wave Optics;Modern Physics;Errors and Instruments;Semiconductors"],[12,'C',"Liquid Solution;Electrochemistry;Solid State;Surface Chemistry;Chemical Kinetics;Coordination Compound;The d and f-Block Elements;Reaction Mechanism;Haloalkanes;Grignard's Reagent;Reduction;Oxidation;Alcohols and Ethers;Aromatic Compound;Carbonyl Compound;Carboxylic Acid and Derivatives;Nitrogen Containing Compound;Biomolecules;Polymers;POC;Chemistry in Everyday Life;Environmental;Hydrogen;Metallurgy;The s-Block Elements;The p-Block Elements;Qualitative Analysis (Salt Analysis)"],[12,'M',"Relation;Function;Inverse Trigonometric Function;Limits;Continuity;Differentiability;Methods of Differentiation;Determinants;Tangent and Normal;Monotonicity;Maxima and Minima;Matrices;Indefinite Integration;Definite Integration;Differential Equations;Area Under The Curve;Vector;Three Dimensional;Coordinate Geometry;Probability;Complex Numbers"]];
const CH=[];RAW.forEach(([c,s,l])=>l.split(';').forEach(n=>CH.push({id:CH.length,c,s,n,tag:'Main+Adv'})));
const DEF={name:'',xp:0,theme:'light',tasks:[],ses:[],tests:[],mist:[],prog:{},rest:[],timer:null,demo:0,hrs:5,iv:[1,3,7,14,30],hide:[]};
let S=Object.assign({},DEF);try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem('b2r')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('b2r',JSON.stringify(S))}catch(e){}};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addD=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const uid=()=>Math.random().toString(36).slice(2,9),real=a=>a.filter(x=>!x.d),col=s=>`var(--${s})`;
const P=id=>S.prog[id]||(S.prog[id]={lt:0,ld:0,pt:0,pd:0,rev:0,last:'',next:'',qa:0,qc:0});
const pc=(a,b)=>b>0?Math.min(1,a/b):0,pct=x=>Math.round(x*100)+'%';
const acc=p=>p.qa?p.qc/p.qa:null;
function mastery(id){const p=P(id),t=pc(p.ld,p.lt),pr=pc(p.pd,p.pt),a=acc(p),r=Math.min(p.rev/3,1);
 const sc=t*.3+pr*.3+(a??0)*.25+r*.15;let L='Learning';if(!p.ld&&!p.pd&&!p.qa)L='Not Started';else if(t>=.9&&pr<.5)L='Needs Practice';else if(p.next&&p.next<today())L='Needs Revision';else if(sc>=.75)L='Strong';return{t,pr,a,r,sc,L}}
const tier=sc=>sc>=.75?'🥇 Gold':sc>=.5?'🥈 Silver':sc>=.25?'🥉 Bronze':'⚪ Grey';
const RANKS=[['Last Bencher',0],['Middle Bencher',100],['Front Bencher',300],['Topper Mode',700],['Rank Hunter',1500]];
const rank=()=>{let i=0;RANKS.forEach((r,k)=>{if(S.xp>=r[1])i=k});return{i,n:RANKS[i][0],lo:RANKS[i][1],hi:(RANKS[i+1]||[0,RANKS[i][1]+1])[1]}};
const xp=n=>{S.xp+=n;save()};
function boom(){const c=['#E8869B','#FFC9A8','#C4B1E8','#6D1F3A','#FFF6EC'];for(let i=0;i<40;i++){const e=document.createElement('i');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=c[i%5];e.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}}
// modal + generic form
function modal(h){const m=document.getElementById('mod');m.innerHTML='<div>'+h+'</div>';m.style.display='flex';m.onclick=e=>{if(e.target===m)closeM()}}
const closeM=()=>{document.getElementById('mod').style.display='none'};
function form(title,fields,cb,extra=''){window._cb=cb;modal(`<h3>${title}</h3>${extra}`+fields.map(f=>{const[k,l,t,o,v]=f;let i;if(t=='sel')i=`<select id="f_${k}">${o.map(x=>`<option value="${esc(x[0]??x)}">${esc(x[1]??x)}</option>`).join('')}</select>`;else if(t=='area')i=`<textarea id="f_${k}" rows="3">${esc(v||'')}</textarea>`;else i=`<input id="f_${k}" type="${t||'text'}" value="${esc(v??'')}">`;return `<label for="f_${k}">${l}</label>${i}`}).join('')+`<div class="row" style="margin-top:14px"><button onclick="subm()">Save</button><button class="x" onclick="closeM()">Cancel</button></div>`);window._f=fields}
function subm(){const o={};_f.forEach(f=>o[f[0]]=document.getElementById('f_'+f[0]).value);closeM();_cb(o)}
const chOpts=()=>[['','— none —'],...CH.filter(c=>!S.hide.includes(c.id)).map(c=>[c.id,`${c.c}th ${SUB[c.s]}: ${c.n}`])];
const subOpts=[['P','Physics'],['C','Chemistry'],['M','Maths']];
const cn=id=>id===''||id==null?'':CH[+id]?.n||'';
const confirmDel=(msg,fn)=>{window._d=fn;modal(`<h3>Sure?</h3><p>${msg}</p><div class="row"><button onclick="closeM();_d()">Yes, delete</button><button class="g" onclick="closeM()">Keep it</button></div>`)};
// ---- tasks
function addTask(d){form('New task',[['title','What are we doing?','text'],['s','Subject','sel',subOpts],['ch','Chapter (optional)','sel',chOpts()],['date','Date','date',null,d||today()],['dur','Minutes','number',null,45],['type','Type','sel',['lecture','practice','revision','test','custom']],['rec','Repeat','sel',['none','daily','weekdays','weekly']]],o=>{if(!o.title)return;const n=o.rec=='daily'?7:o.rec=='weekly'?4:o.rec=='weekdays'?7:1;for(let i=0;i<n;i++){const dt=addD(o.date,o.rec=='weekly'?i*7:i);if(o.rec=='weekdays'&&[0,6].includes(new Date(dt+'T00:00').getDay()))continue;S.tasks.push({id:uid(),title:o.title,s:o.s,ch:o.ch,date:dt,dur:+o.dur||30,type:o.type,st:'pending'})}save();render()})}
function tick(id){const t=S.tasks.find(x=>x.id==id);if(t.st=='done'){t.st='pending'}else{t.st='done';xp(10);boom()}save();render()}
const delTask=id=>confirmDel('This task will vanish.',()=>{S.tasks=S.tasks.filter(x=>x.id!=id);save();render()});
const resched=(id,n)=>{const t=S.tasks.find(x=>x.id==id);t.date=addD(today(),n);t.st='pending';save();render()};
const taskRow=t=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><button class="chk ${t.st=='done'?'on':''}" aria-label="Toggle" onclick="tick('${t.id}')">${t.st=='done'?'✓':''}</button><span class="dot" style="background:${col(t.s)}"></span><div class="sp ${t.st=='done'?'done':''}">${esc(t.title)}<div class="mut">${cn(t.ch)||SUB[t.s]} · ${t.dur}m</div></div><button class="g" onclick="startF('${t.s}','${t.ch}')">Focus</button><button class="x" aria-label="Delete" onclick="delTask('${t.id}')">🗑</button></div>`;
// ---- timer
let tv;const fmt=s=>[s/3600|0,(s/60|0)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':');
const el=()=>S.timer?Math.floor((Date.now()-S.timer.start)/1000):0;
function startF(s,ch){if(!S.timer){S.timer={start:Date.now(),s:s||'P',ch:ch||''};save()}go('Focus')}
function stopF(){const m=Math.max(1,Math.round(el()/60));form('Session debrief',[['min','Actual minutes','number',null,m],['qa','Questions attempted','number',null,0],['qc','Questions correct','number',null,0],['concepts','Concepts covered','text'],['goal','Goal achieved?','sel',['yes','partly','no']],['notes','Notes','area']],o=>{const t=S.timer;S.ses.push({id:uid(),s:t.s,ch:t.ch,min:+o.min||m,qa:+o.qa||0,qc:Math.min(+o.qc||0,+o.qa||0),concepts:o.concepts,goal:o.goal,notes:o.notes,date:today()});if(t.ch!==''){const p=P(t.ch);p.qa+=+o.qa||0;p.qc+=Math.min(+o.qc||0,+o.qa||0);p.pd+=+o.qa||0;if(p.pt<p.pd)p.pt=p.pd}S.timer=null;xp(Math.round(+o.min||m));boom();save();render();if(confirm('Log a mistake from this session?'))addMist(t.ch)})}
setInterval(()=>{const e=document.getElementById('tm');if(e)e.textContent=fmt(el())},500);
// ---- mistakes/tests/revise
const CATS=['Conceptual error','Calculation error','Formula forgotten','Misread question','Time-management issue','Incorrect guess'];
function addMist(ch,test){form('Log a mistake',[['s','Subject','sel',subOpts],['ch','Chapter','sel',chOpts(),ch],['ref','Question reference','text'],['cat','Category','sel',CATS],['why','What went wrong','area'],['fix','Correct approach / key concept','area']],o=>{S.mist.push({id:uid(),...o,re:0,res:'',test:test||'',date:today()});save();render()});if(ch!==undefined&&ch!=='')document.getElementById('f_ch').value=ch}
function addTest(){form('Add test result',[['name','Name','text'],['type','Type','sel',['Chapter','Coaching','JEE Main Mock','JEE Advanced Mock']],['date','Date','date',null,today()],['st','Status','sel',['completed','upcoming']],['max','Max marks','number',null,300],['got','Marks obtained','number'],['p','Physics marks','number'],['c','Chemistry marks','number'],['m','Maths marks','number'],['att','Attempted','number'],['ok','Correct','number'],['notes','Reflection','area']],o=>{if(!o.name)return;S.tests.push({id:uid(),...o,max:+o.max||0,got:+o.got||0,att:+o.att||0,ok:+o.ok||0});save();render()})}
function revise(id){const p=P(id);form('Revised: '+cn(id),[['rec','How much did you recall?','sel',[['low','Need to relearn'],['mid','Remembered some'],['hi','Remembered most']]],['days','Next revision in (days, blank = suggested)','number']],o=>{p.rev++;p.last=today();const k=Math.min(p.rev-1,S.iv.length-1);let d=o.rec=='low'?S.iv[0]:o.rec=='mid'?S.iv[Math.max(0,k-1)]:S.iv[Math.min(k+1,S.iv.length-1)];p.next=addD(today(),+o.days||d);xp(15);boom();save();render()})}
const lectures=(id)=>form('Set totals',[['lt','Total lectures','number',null,P(id).lt],['ld','Lectures done','number',null,P(id).ld],['pt','Total practice items','number',null,P(id).pt],['pd','Practice done','number',null,P(id).pd]],o=>{Object.assign(P(id),{lt:+o.lt,ld:Math.min(+o.ld,+o.lt),pt:+o.pt,pd:Math.min(+o.pd,+o.pt)});if(!P(id).next&&P(id).ld)P(id).next=addD(today(),1);save();render()});
// ---- demo
function demo(on){if(on){S.demo=1;const d=today();[0,1,15,30,43].forEach((c,i)=>{const p=P(c);p.d=1;Object.assign(p,{lt:10,ld:8-i,pt:30,pd:20,rev:i%3,next:d})});S.tasks.push({id:uid(),title:'Demo: kinematics sheet',s:'P',ch:'',date:d,dur:45,type:'practice',st:'pending',d:1});S.ses.push({id:uid(),s:'M',ch:'',min:60,qa:20,qc:16,date:d,d:1});S.tests.push({id:uid(),name:'Demo Mock',type:'JEE Main Mock',date:d,st:'completed',max:300,got:140,att:70,ok:40,p:50,c:40,m:50,d:1})}else{S.demo=0;S.tasks=real(S.tasks);S.ses=real(S.ses);S.tests=real(S.tests);S.mist=real(S.mist);Object.keys(S.prog).forEach(k=>{if(S.prog[k].d)delete S.prog[k]})}save();render()}
// ---- views
let T='Home',SF={s:'',c:'',q:'',sort:'weak'},PW='Revision Zone',RM=null;
const TABS=[['Home','🏠'],['Syllabus','📚'],['Planner','🗓'],['Focus','⏱'],['Power','⚡'],['Profile','👤']];
function go(t){T=t;render();scrollTo(0,0)}
const bar=(v,c)=>`<div class="bar"><i style="width:${pct(v)};background:${c||'var(--rose)'}"></i></div>`;
function overall(){const ids=CH.filter(c=>!S.hide.includes(c.id));const by=s=>{const l=ids.filter(c=>c.s==s);return l.length?l.reduce((a,c)=>a+mastery(c.id).sc,0)/l.length:0};return{all:ids.length?ids.reduce((a,c)=>a+mastery(c.id).sc,0)/ids.length:0,P:by('P'),C:by('C'),M:by('M')}}
function Home(){const d=today(),tk=real(S.tasks).filter(t=>t.date==d||S.demo),done=tk.filter(t=>t.st=='done').length,r=rank(),o=overall();
 const pend=real(S.tasks).filter(t=>t.date<d&&t.st=='pending'),due=CH.filter(c=>P(c.id).next&&P(c.id).next<=d&&!P(c.id).d),ts=real(S.tests).filter(t=>t.st=='upcoming'&&t.date>=d).sort((a,b)=>a.date>b.date?1:-1).slice(0,3);
 const ft=real(S.ses).filter(x=>x.date==d).reduce((a,x)=>a+x.min,0),fw=real(S.ses).filter(x=>x.date>=addD(d,-6)).reduce((a,x)=>a+x.min,0);
 const ratio=tk.length?done/tk.length:0,msg=!tk.length?'Nothing planned. Suspicious.':ratio>=.75?'Chill level: Low risk. Respect.':ratio>=.4?'Halfway there. Keep the bench warm.':`Chill level: High. Complete ${Math.min(2,tk.length-done)} tasks to stay out of the danger zone.`;
 const lec=CH.reduce((a,c)=>a+Math.max(0,P(c.id).lt-P(c.id).ld),0),prc=CH.filter(c=>{const p=P(c.id);return p.pt>p.pd}).length;
 return `<h1>${S.name?`Back from the last bench, ${esc(S.name)}?`:'Back from the last bench?'}</h1><p class="mut">Bunk smart. Rank harder.</p>
 <div class="card"><div class="row"><b>${r.n}</b><span class="sp"></span><span class="mut">${S.xp} XP</span></div>${bar(pc(S.xp-r.lo,r.hi-r.lo))}</div>
 <div class="card"><div class="row"><h3 class="sp">Today's plan</h3><div class="ring" style="--v:${tk.length?done/tk.length*100:0}"><b>${done}/${tk.length}</b></div></div>${tk.length?tk.map(taskRow).join(''):'<p class="mut">Nothing planned. Suspicious.</p>'}<button style="margin-top:10px" onclick="addTask()">+ Add task</button></div>
 <div class="card"><div class="row"><h3 class="sp">Study timer</h3><div id="tm" class="big" style="font-size:1.8rem">${fmt(el())}</div>${S.timer?'<button onclick="stopF()">Stop</button>':'<button onclick="startF()">Start</button>'}</div></div>
 <div class="card"><h3>Progress</h3><div class="row" style="margin-top:8px"><div class="ring" style="--v:${o.all*100}"><b>${pct(o.all)}</b></div>${['P','C','M'].map(s=>`<div class="sp"><span class="mut">${SUB[s]}</span>${bar(o[s],col(s))}</div>`).join('')}</div><p class="mut">Focus today ${ft}m · this week ${fw}m · done ${done} task${done==1?'':'s'}</p></div>
 <div class="card"><h3>Bunk Meter</h3><div class="meter" style="margin:14px 0"><i style="left:calc(${(1-ratio)*100}% - 3px)"></i></div><p class="mut">${msg}</p></div>
 ${pend.length?`<div class="card"><h3>Pending</h3>${pend.map(t=>`<div class="row" style="padding:6px 0"><span class="sp">${esc(t.title)} <span class="mut">${t.date}</span></span><button class="g" onclick="resched('${t.id}',1)">Tomorrow</button><button class="x" onclick="delTask('${t.id}')">Drop</button></div>`).join('')}</div>`:''}
 <div class="card"><h3>Revisions due</h3>${due.length?due.slice(0,5).map(c=>`<div class="row" style="padding:6px 0"><span class="dot" style="background:${col(c.s)}"></span><span class="sp">${esc(c.n)}</span><button class="g" onclick="revise(${c.id})">Revise now</button></div>`).join(''):'<p class="mut">All clear.</p>'}</div>
 <div class="card"><h3>Boss Fights</h3>${ts.length?ts.map(t=>`<p>${esc(t.name)} · <b>Boss Fight in ${Math.round((new Date(t.date)-new Date(d))/864e5)} days</b></p>`).join(''):'<p class="mut">No Boss Fights scheduled.</p>'}</div>
 ${(lec||prc||due.length)?`<div class="card" style="background:var(--peach);color:#4A1626"><h3>🆘 Backlog Recovery</h3><p>${lec} lectures remaining · ${prc} chapters need practice · ${due.length} revisions due${ts[0]?` · Mock in ${Math.round((new Date(ts[0].date)-new Date(d))/864e5)} days`:''}</p><p>About ${Math.ceil((lec*1.5+prc*2+due.length*.5)/S.hrs)} days at ${S.hrs}h/day.</p><button onclick="recover()">Build recovery plan</button></div>`:''}`}
function recover(){const d=today(),items=[];CH.forEach(c=>{const p=P(c.id);if(p.next&&p.next<=d)items.push({title:'Revise '+c.n,s:c.s,ch:c.id,dur:30,type:'revision'});else if(p.lt>p.ld)items.push({title:`Lectures: ${c.n}`,s:c.s,ch:c.id,dur:90,type:'lecture'});else if(p.pt>p.pd)items.push({title:'Practice '+c.n,s:c.s,ch:c.id,dur:60,type:'practice'})});
 let day=1,left=S.hrs*60;const plan=[];items.forEach(i=>{if(i.dur>left){day++;left=S.hrs*60}plan.push({...i,date:addD(d,day)});left-=i.dur});window._plan=plan;
 modal(`<h3>Recovery plan</h3><p class="mut">${plan.length} tasks spread over ${day} days at ${S.hrs}h/day. Nothing gets dumped on tomorrow.</p>${plan.slice(0,12).map(t=>`<p style="margin:4px 0">${t.date.slice(5)} · ${esc(t.title)}</p>`).join('')}<div class="row"><button onclick="pushPlan()">Push to Planner</button><button class="x" onclick="closeM()">Cancel</button></div>`)}
function pushPlan(){window._plan.forEach(t=>S.tasks.push({id:uid(),st:'pending',...t}));closeM();save();go('Planner')}
function Syllabus(){const o=overall();let l=CH.filter(c=>!S.hide.includes(c.id)&&(!SF.s||c.s==SF.s)&&(!SF.c||c.c==SF.c)&&c.n.toLowerCase().includes(SF.q.toLowerCase()));
 l.sort((a,b)=>SF.sort=='weak'?mastery(a.id).sc-mastery(b.id).sc:a.id-b.id);
 return `<h1>Syllabus</h1><p class="mut">Overall ${pct(o.all)}</p><input placeholder="Search chapters" value="${esc(SF.q)}" oninput="SF.q=this.value;render(1)" id="q"><div class="seg" style="margin-top:8px">${[['','All'],['P','Physics'],['C','Chem'],['M','Maths']].map(x=>`<button class="${SF.s==x[0]?'':'g'}" onclick="SF.s='${x[0]}';render()">${x[1]}</button>`).join('')}${[['','11+12'],['11','11th'],['12','12th']].map(x=>`<button class="${SF.c==x[0]?'l':'g'}" onclick="SF.c='${x[0]}';render()">${x[1]}</button>`).join('')}<button class="g" onclick="SF.sort=SF.sort=='weak'?'ord':'weak';render()">${SF.sort=='weak'?'Weakest first':'Syllabus order'}</button></div>`+
 (l.map(c=>{const p=P(c.id),m=mastery(c.id);return `<div class="card"><div class="row"><span class="dot" style="background:${col(c.s)}"></span><b class="sp">${esc(c.n)}</b><span class="tag">${m.L}</span></div><p class="mut" style="margin:2px 0 8px">${c.c}th · ${SUB[c.s]} · ${c.tag} · ${tier(m.sc)}</p>
 <div class="mut">Lectures ${p.ld}/${p.lt}</div>${bar(m.t,col(c.s))}<div class="mut">Practice ${p.pd}/${p.pt}</div>${bar(m.pr,col(c.s))}<div class="mut">Revision ×${p.rev}${p.next?' · next '+p.next:''}</div>${bar(m.r,col(c.s))}<div class="mut">Accuracy ${m.a==null?'not enough data yet':pct(m.a)}</div>${bar(m.a||0,col(c.s))}
 <div class="row" style="margin-top:10px"><span class="mut" title="Mastery = 30% theory + 30% practice + 25% accuracy + 15% revision (3 rounds = full).">Mastery ${pct(m.sc)} ⓘ</span><span class="sp"></span><button class="g" onclick="P(${c.id}).ld=Math.min(P(${c.id}).lt,P(${c.id}).ld+1);save();if(P(${c.id}).ld==P(${c.id}).lt&&P(${c.id}).lt)boom();render()">+ Lecture</button><button class="g" onclick="lectures(${c.id})">Totals</button><button onclick="revise(${c.id})">Revised ✓</button><button class="x" onclick="S.hide.push(${c.id});save();render()" aria-label="Hide">🙈</button></div></div>`}).join('')||'<p class="mut">No chapters match.</p>')}
function Planner(){const d=today(),days=[...Array(7)].map((_,i)=>addD(d,i));const now=new Date(),y=now.getFullYear(),mo=now.getMonth(),n=new Date(y,mo+1,0).getDate(),off=new Date(y,mo,1).getDay();
 const lvl=ds=>{if(S.rest.includes(ds))return['var(--lav)','🌙'];const t=real(S.tasks).filter(x=>x.date==ds),dn=t.filter(x=>x.st=='done').length,f=real(S.ses).some(x=>x.date==ds);if(!t.length&&!f)return['var(--h0)',''];const r=t.length?dn/t.length:.5;return[r>=.67?'var(--h3)':r>0||f?'var(--h1)':'var(--h0)','']};
 const ad=new Set([...real(S.tasks).filter(t=>t.st=='done').map(t=>t.date),...real(S.ses).map(s=>s.date)]);const act=[...ad].filter(x=>x.startsWith(d.slice(0,7))).length;
 return `<h1>Planner</h1><div class="row"><button onclick="addTask()">+ Task</button><button class="l" onclick="smart()">✨ Plan my day</button><button class="g" onclick="${S.rest.includes(d)?`S.rest=S.rest.filter(x=>x!=today())`:`S.rest.push(today())`};save();render()">${S.rest.includes(d)?'Undo rest day':'Mark rest day'}</button></div>${S.rest.includes(d)?'<p class="mut">Rest day logged. Even toppers sleep.</p>':''}
 ${days.map(ds=>{const t=real(S.tasks).filter(x=>x.date==ds);return `<div class="card"><b>${ds==d?'Today':new Date(ds+'T00:00').toDateString().slice(0,10)}</b>${t.length?t.sort((a,b)=>a.dur-b.dur).map(taskRow).join(''):'<p class="mut">Nothing planned. Suspicious.</p>'}</div>`}).join('')}
 <h2>Consistency Calendar</h2><div class="card"><div class="heat">${'SMTWTFS'.split('').map(x=>`<div class="mut">${x}</div>`).join('')}${[...Array(off)].map(()=>'<div></div>').join('')}${[...Array(n)].map((_,i)=>{const ds=`${d.slice(0,8)}${String(i+1).padStart(2,'0')}`,[b,e]=lvl(ds);return `<div style="background:${b};${b=='var(--h3)'?'color:#FFF6EC':''}">${e||i+1}</div>`}).join('')}</div><p class="mut">Active days this month: ${act} · Rest days: ${S.rest.length}. Missed days reset nothing.</p></div>`}
function smart(){const d=addD(today(),1),items=CH.map(c=>({c,m:mastery(c.id)})).filter(x=>x.m.L!='Strong').sort((a,b)=>a.m.sc-b.m.sc).slice(0,Math.max(2,Math.floor(S.hrs*60/60))).map(x=>({title:(x.m.L=='Needs Revision'?'Revise ':'Study ')+x.c.n,s:x.c.s,ch:x.c.id,dur:60,type:'practice',date:d}));window._plan=items;modal(`<h3>Suggested plan for tomorrow</h3>${items.map(t=>`<p style="margin:4px 0">${esc(t.title)} · 60m</p>`).join('')}<div class="row"><button onclick="pushPlan()">Accept</button><button class="g" onclick="smart()">Regenerate</button><button class="x" onclick="closeM()">Dismiss</button></div>`)}
function Focus(){const bySub=['P','C','M'].map(s=>{const l=real(S.ses).filter(x=>x.s==s),m=l.reduce((a,x)=>a+x.min,0),qa=l.reduce((a,x)=>a+x.qa,0),qc=l.reduce((a,x)=>a+x.qc,0);return `<p><span class="dot" style="background:${col(s)}"></span> ${SUB[s]}: ${Math.round(m/6)/10}h focus, ${qa?pct(qc/qa)+' accuracy':'not enough data yet'}</p>`}).join('');
 if(S.timer){document.body.classList.add('focus');return `<div style="text-align:center;padding-top:15vh"><p class="mut">${SUB[S.timer.s]} ${cn(S.timer.ch)}</p><div id="tm" class="big" style="font-size:4.5rem">${fmt(el())}</div><button onclick="stopF()">Finish</button> <button class="x" onclick="S.timer=null;save();render()">Discard</button><div class="card" style="margin-top:30px"><label>Session notes</label><textarea rows="3"></textarea></div></div>`}
 return `<h1>Focus Room</h1><div class="card"><label>Subject</label><select id="fs">${subOpts.map(o=>`<option value="${o[0]}">${o[1]}</option>`)}</select><label>Chapter</label><select id="fc">${chOpts().map(o=>`<option value="${o[0]}">${esc(o[1])}</option>`)}</select><div style="margin-top:12px"><button onclick="startF(fs.value,fc.value)">Start stopwatch</button></div></div><h2>Insights</h2><div class="card">${bySub}<p class="mut">Focus time is shown next to accuracy. More hours doesn't automatically mean better.</p></div><h2>Past sessions</h2>${[...real(S.ses)].reverse().slice(0,10).map(x=>`<div class="card row"><span class="dot" style="background:${col(x.s)}"></span><span class="sp">${x.date} · ${x.min}m · ${x.qc}/${x.qa}</span><button class="x" onclick="confirmDel('Delete this session?',()=>{S.ses=S.ses.filter(y=>y.id!='${x.id}');save();render()})">🗑</button></div>`).join('')||'<p class="mut">No sessions yet.</p>'}`}
function Power(){const seg=['Revision Zone','Test Arena','Reality Check','Mistake Vault'];let h=`<h1>Power</h1><div class="seg">${seg.map(s=>`<button class="${PW==s?'':'g'}" onclick="PW='${s}';render()">${s}</button>`).join('')}</div>`,d=today();
 if(PW==seg[0]){const rv=CH.filter(c=>P(c.id).next&&!P(c.id).d),sec=[['Overdue',rv.filter(c=>P(c.id).next<d)],['Due today',rv.filter(c=>P(c.id).next==d)],['Upcoming',rv.filter(c=>P(c.id).next>d)],['Awaiting first revision',CH.filter(c=>P(c.id).ld>0&&!P(c.id).rev&&!P(c.id).next)]];
  h+=sec.map(([t,l])=>`<h2>${t} (${l.length})</h2>`+l.slice(0,8).map(c=>{const p=P(c.id),a=acc(p);return `<div class="card row"><span class="dot" style="background:${col(c.s)}"></span><span class="sp">${esc(c.n)}<div class="mut">last ${p.last||'never'} · next ${p.next||'—'} · acc ${a==null?'n/a':pct(a)}${t=='Overdue'&&a!=null&&a<.6?' · HIGH priority':''}</div></span><button onclick="revise(${c.id})">Revise now</button></div>`}).join('')).join('')}
 if(PW==seg[1]){const l=real(S.tests).sort((a,b)=>a.date<b.date?1:-1);h+=`<button onclick="addTest()">+ Add test result</button>`+(l.map(t=>`<div class="card"><div class="row"><b class="sp">${esc(t.name)}</b><span class="tag">${t.type}</span></div>${t.st=='upcoming'?`<p>Boss Fight in ${Math.round((new Date(t.date)-new Date(d))/864e5)} days</p>`:`<p>${t.got}/${t.max} (${pct(pc(t.got,t.max))}) · accuracy ${t.att?pct(t.ok/t.att):'n/a'}</p>${[['P',t.p],['C',t.c],['M',t.m]].map(([s,v])=>`<div class="mut">${SUB[s]} ${v||0}</div>${bar(pc(+v||0,t.max/3),col(s))}`).join('')}`}<div class="row" style="margin-top:8px"><button class="g" onclick="addMist('','${t.id}')">Add mistakes</button><button class="x" onclick="confirmDel('Delete this test?',()=>{S.tests=S.tests.filter(y=>y.id!='${t.id}');save();render()})">🗑</button></div></div>`).join('')||'<p class="mut">No Boss Fights logged yet.</p>')}
 if(PW==seg[2]){const done=real(S.tests).filter(t=>t.st=='completed').sort((a,b)=>a.date>b.date?1:-1),ml=real(S.mist),ses=real(S.ses);
  const mx=Math.max(1,...done.map(t=>t.max)),ca=CH.map(c=>({c,a:acc(P(c.id))})).filter(x=>x.a!=null&&!P(x.c.id).d).sort((a,b)=>a.a-b.a);
  const cats=CATS.map(k=>[k,ml.filter(m=>m.cat==k).length]).filter(x=>x[1]);
  h+=`<div class="card"><h3>Mock-test scores</h3>${done.length>1?done.map(t=>`<div class="mut">${esc(t.name)}</div>${bar(t.got/mx)}`).join(''):'<p class="mut">Not enough data yet.</p>'}</div>
  <div class="card"><h3>Chapter accuracy</h3>${ca.length?ca.slice(0,10).map(x=>`<div class="mut">${esc(x.c.n)} ${pct(x.a)}</div>${bar(x.a,col(x.c.s))}`).join(''):'<p class="mut">Not enough data yet.</p>'}</div>
  <div class="card"><h3>Questions & focus</h3><p>${ses.reduce((a,x)=>a+x.qa,0)} questions attempted · ${Math.round(ses.reduce((a,x)=>a+x.min,0)/60*10)/10}h focus</p></div>
  <div class="card"><h3>Mistake patterns</h3>${cats.length?cats.map(([k,n])=>`<div class="mut">${k}: ${n} (${pct(n/ml.length)})</div>${bar(n/ml.length,'var(--lav)')}`).join(''):'<p class="mut">Not enough data yet.</p>'}</div>
  <div class="card"><h3>Needs Attention</h3>${CH.filter(c=>['Needs Practice','Needs Revision'].includes(mastery(c.id).L)).slice(0,6).map(c=>`<div class="row" style="padding:5px 0"><span class="sp">${esc(c.n)} <span class="tag">${mastery(c.id).L}</span></span><button class="g" onclick="${mastery(c.id).L=='Needs Revision'?`revise(${c.id})`:`addTask();`}">${mastery(c.id).L=='Needs Revision'?'Revise now':'Plan practice'}</button></div>`).join('')||'<p class="mut">Nothing flagged.</p>'}</div>`}
 if(PW==seg[3]){const l=real(S.mist).filter(m=>!SF.mc||m.cat==SF.mc);if(RM!=null){const m=S.mist.find(x=>x.id==RM);return h+(m?`<div class="card"><h3>${esc(m.ref||'Mistake')}</h3><p class="mut">${cn(m.ch)}</p><button class="g" onclick="this.nextElementSibling.style.display='block'">Peek at what went wrong</button><div style="display:none"><p>${esc(m.why)}</p><p><b>Fix:</b> ${esc(m.fix)}</p></div><div class="row" style="margin-top:12px"><button onclick="rt('${m.id}',1)">Solved now</button><button class="g" onclick="rt('${m.id}',0)">Still wrong</button></div></div>`:'')+`<button class="x" onclick="RM=null;render()">Exit retry</button>`}
  h+=`<div class="row"><button onclick="addMist('')">+ Log mistake</button><button class="l" onclick="const u=real(S.mist).filter(m=>!m.re);if(u.length){RM=u[0].id;render()}else alert('Nothing to retry!')">Retry mistakes</button></div><select style="margin:10px 0" onchange="SF.mc=this.value;render()"><option value="">All categories</option>${CATS.map(c=>`<option ${SF.mc==c?'selected':''}>${c}</option>`)}</select>`+(l.map(m=>`<div class="card"><div class="row"><b class="sp">${esc(m.ref||'Mistake')}</b><span class="tag">${m.cat}</span></div><p class="mut">${SUB[m.s]} ${cn(m.ch)} · ${m.re?'reattempted: '+m.res:'not reattempted'}</p><p>${esc(m.why)}</p><button class="x" onclick="confirmDel('Delete this mistake?',()=>{S.mist=S.mist.filter(y=>y.id!='${m.id}');save();render()})">🗑</button></div>`).join('')||'<p class="mut">Vault is empty. Suspiciously perfect.</p>')}
 return h}
function rt(id,ok){const m=S.mist.find(x=>x.id==id);m.re=1;m.res=ok?'solved':'still wrong';if(ok){xp(10);boom()}const u=S.mist.filter(x=>!x.re&&!x.d);RM=u.length?u[0].id:null;save();render()}
function csv(a){if(!a.length)return '';const k=Object.keys(a[0]);return k.join(',')+'\n'+a.map(r=>k.map(x=>JSON.stringify(r[x]??'')).join(',')).join('\n')}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function Profile(){return `<h1>Profile</h1><div class="card"><label>Name</label><input value="${esc(S.name)}" onchange="S.name=this.value;save()"><label>Daily study hours</label><input type="number" value="${S.hrs}" onchange="S.hrs=+this.value||5;save()"><label>Revision intervals (days, comma separated)</label><input value="${S.iv.join(',')}" onchange="S.iv=this.value.split(',').map(Number).filter(Boolean);save()"><div class="row" style="margin-top:12px"><button onclick="S.theme=S.theme=='dark'?'light':'dark';save();render()">${S.theme=='dark'?'Light':'Wine'} theme</button></div></div>
 <div class="card"><h3>Demo mode</h3><p class="mut">Sample data is flagged and never counted in real analytics.</p><div class="row"><button class="l" onclick="demo(${S.demo?0:1})">${S.demo?'Clear demo data':'Load demo data'}</button></div></div>
 <div class="card"><h3>Your data</h3><div class="row"><button class="g" onclick="dl('bunk2rank.json',JSON.stringify(S,null,1),'application/json')">Export JSON</button><button class="g" onclick="dl('bunk2rank.csv',['tasks','ses','tests','mist'].map(k=>'# '+k+'\\n'+csv(real(S[k]))).join('\\n\\n'),'text/csv')">Export CSV</button><button class="x" onclick="confirmDel('This permanently deletes all your Bunk2Rank data.',()=>{localStorage.removeItem('b2r');location.reload()})">Delete everything</button></div></div>`}
function quick(){modal(`<h3>Quick add</h3><div class="row"><button onclick="closeM();addTask()">Task</button><button class="g" onclick="closeM();addTest()">Test</button><button class="l" onclick="closeM();addMist('')">Mistake</button><button class="g" onclick="closeM();startF()">Session</button></div>`)}
function render(keep){document.documentElement.dataset.theme=S.theme;document.body.classList.remove('focus');const V={Home,Syllabus,Planner,Focus,Power,Profile};let h;try{h=V[T]()}catch(e){h=`<div class="card"><p>Something broke: ${esc(e.message)}</p><button onclick="render()">Retry</button></div>`}
 document.getElementById('app').innerHTML=h;document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${T==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[0]}</button>`).join('');
 if(keep){const q=document.getElementById('q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}}
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
